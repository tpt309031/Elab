name: Daily hybrid research

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-hybrid-research
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-*.txt

      - name: Install research dependencies
        run: |
          python -m pip install -r research/requirements-core.txt
          python -m pip install pytest

      - name: Verify leakage, scoring, and learning invariants
        run: python -m pytest tests -q

      - name: Refresh market and walk-forward artifacts
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Research refresh attempt ${attempt}/3"
            if python research/run_pipeline.py; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "All market refresh attempts failed; refusing to publish a stale artifact"
              exit 1
            fi
            sleep 120
          done

      - name: Verify immutable ledger and adaptive selection
        run: python research/verify_artifact.py

      - name: Commit evaluated forecasts
        shell: bash
        run: |
          git config user.name "elab-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache/BTCUSDT_1d.csv data/cache/BTCUSDT_1h.csv data/cache/BTCUSDT_4h.csv data/hybrid_research.json data/learning_state.json public/data/hybrid_research.json
          if git diff --cached --quiet; then
            echo "No closed-candle or research changes"
            exit 0
          fi
          git commit -m "Refresh daily hybrid research"
          git push

      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Daily research pipeline failed"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Forecast publication was not advanced."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update pipeline failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="[ELAB] Daily research pipeline failure"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ISSUE_NUMBER=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
          BODY="Daily refresh failed at ${GITHUB_SHA}. Run: ${RUN_URL}. The stale-data fail-closed rule prevented publication."
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
