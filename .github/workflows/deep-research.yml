name: Weekly deep challenger research

on:
  schedule:
    - cron: "40 4 * * 0"
  workflow_dispatch:
    inputs:
      epochs:
        description: "Chronological training epochs per architecture"
        required: false
        default: "12"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-deep-challenger-research
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-*.txt

      - name: Install isolated deep dependencies
        run: |
          python -m pip install -r research/requirements-deep.txt
          python -m pip install pytest

      - name: Verify intraday cutoff and architecture contracts
        run: python -m pytest tests/test_deep_dataset.py tests/test_models.py -q

      - name: Train six chronological challengers
        env:
          DEEP_EPOCHS: ${{ inputs.epochs || '12' }}
        run: python research/train_deep_challengers.py --epochs "$DEEP_EPOCHS" --folds 2

      - name: Verify isolated deep artifact
        run: python research/verify_deep_artifact.py

      - name: Commit deep challenger artifact
        shell: bash
        run: |
          git config user.name "elab-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deep_research.json public/data/deep_research.json
          if git diff --cached --quiet; then
            echo "No deep challenger changes"
            exit 0
          fi
          git commit -m "Refresh weekly deep challengers"
          git push

      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Weekly deep challenger pipeline failed"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Daily production remains isolated and operational."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update deep failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="[ELAB] Weekly deep challenger failure"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ISSUE_NUMBER=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
          BODY="Deep challenger refresh failed at ${GITHUB_SHA}. Run: ${RUN_URL}. Daily production was not modified."
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
