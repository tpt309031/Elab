<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elab Bitcoin Astro Scores</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23d97706'/%3E%3Ctext x='32' y='42' font-size='27' text-anchor='middle' font-family='Arial' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-soft: #eef2f5;
  --ink: #17212b;
  --muted: #637080;
  --line: #d8e0e7;
  --line-strong: #b8c5d0;
  --blue: #2563eb;
  --green: #157f52;
  --orange: #d97706;
  --red: #bd3f1f;
  --amber: #9a6500;
  --teal: #0f766e;
  --black: #111827;
  --shadow: 0 18px 42px rgba(31, 41, 55, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.45;
}

button,
input,
select {
  font: inherit;
}

.app-shell {
  width: min(1480px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 24px 0 28px;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding: 8px 0 18px;
}

.eyebrow {
  margin: 0 0 6px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 3px;
  font-size: clamp(28px, 4vw, 46px);
  line-height: 1.05;
  letter-spacing: 0;
}

.subtitle {
  margin-bottom: 0;
  color: var(--muted);
  font-size: 15px;
}

.status-pill {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}

.status-pill span {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.toolbar {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) repeat(2, minmax(160px, 220px));
  gap: 12px;
  align-items: end;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.control-group {
  min-width: 0;
}

.control-label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0;
}

.segmented {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-soft);
}

.segmented button {
  min-height: 34px;
  padding: 6px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}

.segmented button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(31, 41, 55, 0.12);
}

.select-field select {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  padding: 0 12px;
}

.metric-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.metric-check {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 34px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  user-select: none;
}

.metric-check input {
  width: 15px;
  height: 15px;
  accent-color: var(--black);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.dot.composite { color: var(--black); }
.dot.finance { color: var(--blue); }
.dot.career { color: var(--green); }
.dot.volatility { color: var(--orange); }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(160px, 1fr));
  gap: 12px;
  margin: 16px 0;
}

.stat-card,
.chart-panel,
.side-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.stat-card {
  min-height: 106px;
  padding: 14px;
}

.stat-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0;
}

.stat-value {
  margin: 10px 0 0;
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 800;
  line-height: 1;
}

.stat-note {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 16px;
  align-items: start;
}

.chart-panel {
  min-width: 0;
  overflow: hidden;
}

.chart-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px 10px;
  border-bottom: 1px solid var(--line);
}

.chart-head h2,
.side-panel h2 {
  margin-bottom: 0;
  font-size: 18px;
}

.range-caption {
  color: var(--muted);
  font-size: 13px;
  text-align: right;
}

.chart-wrap {
  position: relative;
  height: min(58vh, 620px);
  min-height: 390px;
  padding: 10px 10px 14px;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.tooltip {
  position: absolute;
  z-index: 3;
  display: none;
  width: 218px;
  padding: 10px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.98);
  color: var(--ink);
  box-shadow: 0 12px 28px rgba(31, 41, 55, 0.16);
  pointer-events: none;
}

.tooltip strong {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
}

.tooltip-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}

.tooltip-row b {
  color: var(--ink);
}

.side-panel {
  overflow: hidden;
}

.side-section {
  padding: 16px;
  border-bottom: 1px solid var(--line);
}

.side-section:last-child {
  border-bottom: 0;
}

.selected-date {
  margin: 0 0 8px;
  font-size: 24px;
  font-weight: 800;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.badge.good {
  background: #e0f2ef;
  color: var(--teal);
}

.badge.watch {
  background: #fff3cd;
  color: var(--amber);
}

.badge.danger {
  background: #ffe6de;
  color: var(--red);
}

.badge.neutral {
  background: var(--surface-soft);
  color: var(--muted);
}

.detail-list {
  display: grid;
  gap: 10px;
  margin: 14px 0 0;
}

.detail-item {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}

.detail-item:last-child {
  border-bottom: 0;
}

.detail-item dt {
  color: var(--muted);
}

.detail-item dd {
  margin: 0;
  font-weight: 800;
}

.table-wrap {
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th,
td {
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}

th {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0;
}

td:last-child,
th:last-child {
  text-align: right;
}

tbody tr {
  cursor: pointer;
}

tbody tr:hover {
  background: #f7f9fb;
}

.footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 2px 0;
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 1120px) {
  .toolbar {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .summary-grid {
    grid-template-columns: repeat(3, minmax(160px, 1fr));
  }

  .workspace {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .app-shell {
    width: min(100vw - 20px, 1480px);
    padding-top: 14px;
  }

  .topbar,
  .chart-head,
  .footer {
    align-items: flex-start;
    flex-direction: column;
  }

  .toolbar,
  .summary-grid {
    grid-template-columns: 1fr;
  }

  .chart-wrap {
    min-height: 340px;
    height: 62vh;
  }

  .status-pill {
    justify-content: flex-start;
  }
}
</style>
</head>

<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Elab Astro Module</p>
      <h1>Bitcoin Astro Scores</h1>
      <p class="subtitle">Bộ chỉ số 2017-2028, xem theo cửa sổ thời gian bắt đầu từ mốc hiện tại của dữ liệu.</p>
    </div>
    <div class="status-pill" aria-label="Thông tin dữ liệu">
      <span id="recordCount"></span>
      <span id="dateSpan"></span>
    </div>
  </header>

  <section class="toolbar" aria-label="Bộ lọc">
    <div class="control-group">
      <span class="control-label">Khoảng xem</span>
      <div class="segmented" role="group" aria-label="Khoảng xem">
        <button type="button" data-range="30">30 ngày</button>
        <button type="button" data-range="90">90 ngày</button>
        <button type="button" data-range="180">6 tháng</button>
        <button type="button" data-range="365">1 năm</button>
        <button type="button" data-range="1095">3 năm</button>
        <button type="button" data-range="all">Tất cả</button>
      </div>
    </div>

    <label class="control-group select-field">
      <span class="control-label">Làm mượt</span>
      <select id="smoothSelect">
        <option value="auto">Tự động</option>
        <option value="1">Ngày</option>
        <option value="7">7 ngày</option>
        <option value="30">30 ngày</option>
      </select>
    </label>

    <label class="control-group select-field">
      <span class="control-label">Đánh dấu</span>
      <select id="highlightSelect">
        <option value="events">Sự kiện</option>
        <option value="volatility">Biến động cao</option>
        <option value="none">Không</option>
      </select>
    </label>
  </section>

  <div class="metric-strip" aria-label="Chỉ số hiển thị">
    <label class="metric-check"><input type="checkbox" data-metric="composite" checked><span class="dot composite"></span>Tổng hợp</label>
    <label class="metric-check"><input type="checkbox" data-metric="finance" checked><span class="dot finance"></span>Tài chính</label>
    <label class="metric-check"><input type="checkbox" data-metric="career" checked><span class="dot career"></span>Sự nghiệp</label>
    <label class="metric-check"><input type="checkbox" data-metric="volatility" checked><span class="dot volatility"></span>Biến động</label>
  </div>

  <section class="summary-grid" id="summaryCards" aria-label="Tóm tắt"></section>

  <section class="workspace">
    <article class="chart-panel">
      <div class="chart-head">
        <h2>Diễn biến chỉ số</h2>
        <div class="range-caption" id="rangeCaption"></div>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <canvas id="chart" role="img" aria-label="Biểu đồ Bitcoin Astro Scores"></canvas>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </article>

    <aside class="side-panel" aria-label="Chi tiết">
      <section class="side-section" id="selectedDetails"></section>
      <section class="side-section">
        <h2>Ngày cần chú ý</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ngày</th>
                <th>Nhóm</th>
                <th>Điểm</th>
              </tr>
            </thead>
            <tbody id="notableRows"></tbody>
          </table>
        </div>
      </section>
    </aside>
  </section>

  <footer class="footer">
    <span>Nguồn: bitcoin_astro_scores.xlsx</span>
    <span id="smoothingNote"></span>
  </footer>
</main>

const formatNumber = new Intl.NumberFormat("vi-VN", {
  maximumFractionDigits: 1,
  minimumFractionDigits: 0
});

function parseDate(value) {
  const parts = value.split("-").map(Number);
  return Date.UTC(parts[0], parts[1] - 1, parts[2]);
}

function todayTime() {
  const now = new Date();
  return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
}

function formatDate(value) {
  const date = new Date(typeof value === "number" ? value : parseDate(value));
  return new Intl.DateTimeFormat("vi-VN", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    timeZone: "UTC"
  }).format(date);
}

function formatShortDate(value) {
  const date = new Date(typeof value === "number" ? value : parseDate(value));
  return new Intl.DateTimeFormat("vi-VN", {
    day: "2-digit",
    month: "2-digit",
    year: "2-digit",
    timeZone: "UTC"
  }).format(date);
}

function nearestIndex(time) {
  if (time <= data[0].time) return 0;
  if (time >= data[data.length - 1].time) return data.length - 1;
  let lo = 0;
  let hi = data.length - 1;
  while (lo < hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (data[mid].time < time) lo = mid + 1;
    else hi = mid;
  }
  if (lo === 0) return 0;
  const prev = lo - 1;
  return Math.abs(data[lo].time - time) < Math.abs(data[prev].time - time) ? lo : prev;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function compositeScore(point) {
  return clamp(point.finance * 0.45 + point.career * 0.25 + (100 - point.volatility) * 0.30, 0, 100);
}

function getRegime(point) {
  const score = compositeScore(point);
  if (point.volatility >= 75 || score < 40) return { label: "Rủi ro cao", tone: "danger" };
  if (point.event || point.volatility >= 60 || score < 55) return { label: "Theo dõi", tone: "watch" };
  if (score >= 70 && point.volatility <= 45) return { label: "Thuận lợi", tone: "good" };
  return { label: "Cân bằng", tone: "neutral" };
}

function getVisibleData() {
  if (state.range === "all") return data.slice();
  const anchor = data[state.viewAnchorIndex];
  const days = Number(state.range);
  let start = anchor.time;
  let end = anchor.time + Math.max(0, days - 1) * MS_DAY;
  const first = data[0].time;
  const last = data[data.length - 1].time;
  if (start < first) {
    start = first;
  }
  if (end > last) {
    end = last;
  }
  return data.filter((point) => point.time >= start && point.time <= end);
}

function resolveSmoothing(points) {
  if (state.smoothing !== "auto") return Number(state.smoothing);
  if (points.length > 1100) return 30;
  if (points.length > 420) return 7;
  return 1;
}

function decoratePoints(points) {
  const windowSize = resolveSmoothing(points);
  const prepared = points.map((point) => ({
    ...point,
    composite: compositeScore(point)
  }));
  ["finance", "career", "volatility", "composite"].forEach((key) => {
    const queue = [];
    let sum = 0;
    prepared.forEach((point) => {
      queue.push(point[key]);
      sum += point[key];
      if (queue.length > windowSize) sum -= queue.shift();
      point[key + "Smooth"] = sum / queue.length;
    });
  });
  return prepared;
}

function average(points, key) {
  if (!points.length) return 0;
  return points.reduce((sum, point) => sum + point[key], 0) / points.length;
}

function updateControls() {
  document.querySelectorAll("[data-range]").forEach((button) => {
    button.setAttribute("aria-pressed", String(button.dataset.range === state.range));
  });
  els.smoothSelect.value = state.smoothing;
  els.highlightSelect.value = state.highlight;
  document.querySelectorAll("[data-metric]").forEach((checkbox) => {
    checkbox.checked = Boolean(state.metrics[checkbox.dataset.metric]);
  });
}

function updateSummary(points) {
  const selected = data[state.selectedIndex];
  const selectedRegime = getRegime(selected);
  const eventCount = points.filter((point) => point.event).length;
  const avgComposite = average(points, "composite");
  const avgFinance = average(points, "finance");
  const avgCareer = average(points, "career");
  const avgVolatility = average(points, "volatility");
  els.summaryCards.innerHTML = [
    statCard("Ngày đang chọn", formatDate(selected.date), selectedRegime.label, selectedRegime.tone),
    statCard("Tổng hợp", formatNumber.format(compositeScore(selected)), "Trung bình vùng: " + formatNumber.format(avgComposite), "neutral"),
    statCard("Tài chính", formatNumber.format(selected.finance), "Trung bình vùng: " + formatNumber.format(avgFinance), "neutral"),
    statCard("Sự nghiệp", formatNumber.format(selected.career), "Trung bình vùng: " + formatNumber.format(avgCareer), "neutral"),
    statCard("Biến động", formatNumber.format(selected.volatility), eventCount + " ngày sự kiện", selected.volatility >= 75 ? "danger" : "neutral")
  ].join("");
}

function statCard(label, value, note, tone) {
  return [
    '<article class="stat-card">',
    '<div class="stat-label"><span>' + label + '</span><span class="badge ' + tone + '">' + note + '</span></div>',
    '<p class="stat-value">' + value + '</p>',
    '</article>'
  ].join("");
}

function updateSelectedDetails() {
  const selected = data[state.selectedIndex];
  const regime = getRegime(selected);
  const eventText = selected.event ? "Có" : "Không";
  els.selectedDetails.innerHTML = [
    '<h2>Ngày đang chọn</h2>',
    '<p class="selected-date">' + formatDate(selected.date) + '</p>',
    '<span class="badge ' + regime.tone + '">' + regime.label + '</span>',
    '<dl class="detail-list">',
    detailItem("Tổng hợp", formatNumber.format(compositeScore(selected))),
    detailItem("Tài chính", formatNumber.format(selected.finance)),
    detailItem("Sự nghiệp", formatNumber.format(selected.career)),
    detailItem("Biến động", formatNumber.format(selected.volatility)),
    detailItem("Sự kiện", eventText),
    '</dl>'
  ].join("");
}

function detailItem(label, value) {
  return '<div class="detail-item"><dt>' + label + '</dt><dd>' + value + '</dd></div>';
}

function notableScore(point) {
  const eventWeight = point.event ? 28 : 0;
  const volatilityWeight = Math.max(0, point.volatility - 55) * 1.25;
  const edgeWeight = Math.abs(compositeScore(point) - 50) * 0.35;
  return eventWeight + volatilityWeight + edgeWeight;
}

function updateNotableRows(points) {
  const rows = points

    .sort((a, b) => b.score - a.score)

  els.notableRows.innerHTML = rows.map(({ point, regime }) => [
    '<tr data-index="' + point.index + '">',
    '<td>' + formatShortDate(point.date) + '</td>',
    '<td><span class="badge ' + regime.tone + '">' + regime.label + '</span></td>',
    '<td>' + formatNumber.format(compositeScore(point)) + '</td>',
    '</tr>'
  ].join("")).join("");
}

function fitCanvas() {
  const rect = els.canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(320, Math.round(rect.width));
  const height = Math.max(260, Math.round(rect.height));

  els.canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

function xForIndex(index, points) {
  if (points.length <= 1) return chartState.margin.left + chartState.plotWidth / 2;
  return chartState.margin.left + (index / (points.length - 1)) * chartState.plotWidth;
}

function yForValue(value) {
  return chartState.margin.top + (100 - value) / 100 * chartState.plotHeight;
}

function drawChart(points) {
  fitCanvas();
  chartState.points = points;
  ctx.clearRect(0, 0, chartState.width, chartState.height);
  drawGrid(points);
  drawHighlights(points);
  if (state.metrics.volatility) drawBars(points, "volatilitySmooth", getCss("--orange"));
  if (state.metrics.finance) drawLine(points, "financeSmooth", getCss("--blue"), 2);
  if (state.metrics.career) drawLine(points, "careerSmooth", getCss("--green"), 2);
  if (state.metrics.composite) drawLine(points, "compositeSmooth", getCss("--black"), 2.6);
  drawMarker(points);
}

function getCss(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function drawGrid(points) {
  const m = chartState.margin;
  ctx.save();
  ctx.strokeStyle = getCss("--line");
  ctx.fillStyle = getCss("--muted");
  ctx.lineWidth = 1;
  ctx.font = "12px ui-sans-serif, system-ui";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let value = 0; value <= 100; value += 20) {
    const y = yForValue(value);
    ctx.beginPath();
    ctx.moveTo(m.left, y);
    ctx.lineTo(chartState.width - m.right, y);
    ctx.stroke();
    ctx.fillText(String(value), m.left - 10, y);
  }
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const tickCount = Math.min(6, Math.max(2, points.length));
  for (let tick = 0; tick < tickCount; tick += 1) {
    const idx = tickCount === 1 ? 0 : Math.round((tick / (tickCount - 1)) * (points.length - 1));
    const x = xForIndex(idx, points);
    ctx.fillText(formatShortDate(points[idx].date), x, chartState.height - m.bottom + 16);
  }
  ctx.restore();
}

function drawHighlights(points) {
  if (state.highlight === "none") return;
  const shouldMark = state.highlight === "events"
    ? (point) => point.event
    : (point) => point.volatility >= 70;
  const color = state.highlight === "events" ? "rgba(189, 63, 31, 0.18)" : "rgba(217, 119, 6, 0.16)";
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, Math.min(3, chartState.plotWidth / Math.max(points.length, 1)));
  points.forEach((point, index) => {
    if (!shouldMark(point)) return;
    const x = xForIndex(index, points);
    ctx.beginPath();
    ctx.moveTo(x, chartState.margin.top);
    ctx.lineTo(x, chartState.height - chartState.margin.bottom);
    ctx.stroke();
  });
  ctx.restore();
}

function drawBars(points, key, color) {
  const baseY = yForValue(0);
  const barWidth = Math.max(1, Math.min(7, chartState.plotWidth / Math.max(points.length, 1) * 0.66));
  ctx.save();
  ctx.fillStyle = hexToRgba(color, points.length > 700 ? 0.16 : 0.24);
  points.forEach((point, index) => {
    const x = xForIndex(index, points);
    const y = yForValue(point[key]);
    ctx.fillRect(x - barWidth / 2, y, barWidth, baseY - y);
  });
  ctx.restore();
}

function drawLine(points, key, color, width) {
  if (!points.length) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  points.forEach((point, index) => {
    const x = xForIndex(index, points);
    const y = yForValue(point[key]);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.restore();
}

function drawMarker(points) {
  if (!points.length) return;
  const selectedPointIndex = points.findIndex((point) => point.index === state.selectedIndex);
  const markerIndex = state.hoverIndex !== null ? state.hoverIndex : selectedPointIndex;
  if (markerIndex < 0 || markerIndex >= points.length) return;
  const point = points[markerIndex];
  const x = xForIndex(markerIndex, points);
  const y = yForValue(point.compositeSmooth);
  ctx.save();
  ctx.strokeStyle = "rgba(17, 24, 39, 0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, chartState.margin.top);
  ctx.lineTo(x, chartState.height - chartState.margin.bottom);
  ctx.stroke();
  ctx.fillStyle = getCss("--surface");
  ctx.strokeStyle = getCss("--black");
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function hexToRgba(hex, alpha) {
  const cleaned = hex.replace("#", "");
  const bigint = parseInt(cleaned, 16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
}

function showTooltip(point, x, y) {
  const regime = getRegime(point);
  els.tooltip.innerHTML = [
    '<strong>' + formatDate(point.date) + ' · ' + regime.label + '</strong>',
    tooltipRow("Tổng hợp", formatNumber.format(compositeScore(point))),
    tooltipRow("Tài chính", formatNumber.format(point.finance)),
    tooltipRow("Sự nghiệp", formatNumber.format(point.career)),
    tooltipRow("Biến động", formatNumber.format(point.volatility)),
    tooltipRow("Sự kiện", point.event ? "Có" : "Không")
  ].join("");
  const wrapRect = els.chartWrap.getBoundingClientRect();
  const left = clamp(x + 14, 10, wrapRect.width - 230);
  const top = clamp(y - 52, 10, wrapRect.height - 154);
  els.tooltip.style.display = "block";
  els.tooltip.style.left = left + "px";
  els.tooltip.style.top = top + "px";
}

function tooltipRow(label, value) {
  return '<div class="tooltip-row"><span>' + label + '</span><b>' + value + '</b></div>';
}

function updateRangeCaption(points, smoothingWindow) {
  if (!points.length) return;
  const first = points[0];
  const last = points[points.length - 1];
  const label = state.range === "all" ? "toàn bộ dữ liệu" : points.length + " ngày từ mốc hiện tại";
  els.rangeCaption.textContent = formatDate(first.date) + " - " + formatDate(last.date) + " · " + label;
  els.smoothingNote.textContent = "Làm mượt đang dùng: " + (smoothingWindow === 1 ? "ngày" : smoothingWindow + " ngày");
}

function render() {
  const visible = getVisibleData();
  const points = decoratePoints(visible);
  const smoothingWindow = resolveSmoothing(visible);
  updateControls();
  updateSummary(points);
  updateSelectedDetails();
  updateNotableRows(points);
  updateRangeCaption(points, smoothingWindow);
  drawChart(points);
}

document.querySelector(".segmented").addEventListener("click", (event) => {
  const button = event.target.closest("[data-range]");
  if (!button) return;
  state.range = button.dataset.range;
  state.hoverIndex = null;
  els.tooltip.style.display = "none";
  render();
});

els.smoothSelect.addEventListener("change", () => {
  state.smoothing = els.smoothSelect.value;
  state.hoverIndex = null;
  render();
});

els.highlightSelect.addEventListener("change", () => {
  state.highlight = els.highlightSelect.value;
  render();
});

document.querySelectorAll("[data-metric]").forEach((checkbox) => {
  checkbox.addEventListener("change", () => {
    const checkedCount = Array.from(document.querySelectorAll("[data-metric]")).filter((input) => input.checked).length;
    if (checkedCount === 0) {
      checkbox.checked = true;
      return;
    }
    state.metrics[checkbox.dataset.metric] = checkbox.checked;
    render();
  });
});

els.canvas.addEventListener("mousemove", (event) => {
  if (!chartState.points.length) return;
  const rect = els.canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const left = chartState.margin.left;
  const right = chartState.width - chartState.margin.right;
  const top = chartState.margin.top;
  const bottom = chartState.height - chartState.margin.bottom;
  if (x < left || x > right || y < top || y > bottom) {
    state.hoverIndex = null;
    els.tooltip.style.display = "none";
    drawChart(chartState.points);
    return;
  }
  const index = clamp(Math.round(((x - left) / chartState.plotWidth) * (chartState.points.length - 1)), 0, chartState.points.length - 1);
  state.hoverIndex = index;
  const point = chartState.points[index];
  showTooltip(point, x, yForValue(point.compositeSmooth));
  drawChart(chartState.points);
});

els.canvas.addEventListener("mouseleave", () => {
  state.hoverIndex = null;
  els.tooltip.style.display = "none";
  drawChart(chartState.points);
});

els.canvas.addEventListener("click", () => {
  if (state.hoverIndex === null || !chartState.points[state.hoverIndex]) return;
  state.selectedIndex = chartState.points[state.hoverIndex].index;
  state.hoverIndex = null;
  els.tooltip.style.display = "none";
  render();
});

els.notableRows.addEventListener("click", (event) => {
  const row = event.target.closest("[data-index]");
  if (!row) return;
  state.selectedIndex = Number(row.dataset.index);
  state.hoverIndex = null;
  els.tooltip.style.display = "none";
  render();
});

window.addEventListener("resize", () => {
  window.requestAnimationFrame(() => drawChart(chartState.points));
});

els.recordCount.textContent = data.length.toLocaleString("vi-VN") + " dòng";
els.dateSpan.textContent = formatDate(data[0].date) + " - " + formatDate(data[data.length - 1].date);
render();
</script>
</body>
</html>
