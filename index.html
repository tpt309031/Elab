<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC Energy Index Lab</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root{--bg:#050505;--panel:#101010;--line:#2a2a2a;--text:#f8fafc;--muted:#9ca3af;--btc:#f7931a;--green:#22c55e;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(247,147,26,.18),transparent 30%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}
    header{position:sticky;top:0;z-index:2;background:rgba(5,5,5,.84);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1380px;margin:auto;padding:20px}.k{color:var(--btc);letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:800}
    h1{font-size:clamp(30px,4vw,52px);margin:6px 0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.m{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.2fr .8fr}
    .card{background:linear-gradient(180deg,rgba(22,22,22,.96),rgba(9,9,9,.95));border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 18px 70px rgba(0,0,0,.28)}
    .metric{border-left:3px solid var(--btc)}.metric b{font-size:26px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#111;color:var(--text);border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.tab.on{background:rgba(247,147,26,.16);border-color:var(--btc)}
    .pane{display:none}.pane.on{display:block}label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-right:8px}select,input{background:#090909;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}
    .plot{height:650px}.small{height:480px}iframe{width:100%;height:430px;border:0;border-radius:16px;background:#111}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:9px;text-align:left}th{color:#fed7aa;text-transform:uppercase;font-size:11px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;text-transform:uppercase}.up,.pump,.correct{color:#bbf7d0}.down,.dump,.wrong{color:#fecaca}.pending{color:#fff}.scenario{border:1px solid var(--line);border-left:5px solid #fff;border-radius:14px;padding:12px;margin:9px 0;background:rgba(255,255,255,.035)}
    @media(max-width:900px){.m,.two{grid-template-columns:1fr}.plot{height:520px}}
  </style>
</head>
<body>
<header><div class="wrap"><div class="k">Quant Research Console</div><h1>BTC Energy Index Lab</h1><div id="status" class="muted">Loading...</div></div></header>
<main class="wrap">
  <section id="metrics" class="grid m"></section>
  <nav class="tabs"><button class="tab on" data-p="charts">Charts</button><button class="tab" data-p="future">Future</button><button class="tab" data-p="patterns">Patterns</button><button class="tab" data-p="research">Research</button></nav>
  <section id="charts" class="pane on"><div class="grid two"><div class="card"><label>Year <select id="hy"></select></label><label>Month <select id="hm"></select></label><div id="price" class="plot"></div></div><div class="card"><h3>BTC 5m realtime</h3><iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=5&theme=dark&style=1&timezone=Etc%2FUTC&hide_side_toolbar=0&allow_symbol_change=1&save_image=0"></iframe><p class="muted">TradingView intraday. Forecast grading uses closed UTC daily candles.</p></div></div></section>
  <section id="future" class="pane"><div class="card"><label>Year <select id="fy"></select></label><label>Month <select id="fm"></select></label><label>Direction <select id="fd"><option>All</option><option>up</option><option>down</option><option>sideway</option></select></label><label>Min confidence <input id="ft" type="number" min=".36" max=".95" step=".01" value=".60"></label><div id="fchart" class="small"></div><div id="notes"></div></div></section>
  <section id="patterns" class="pane"><div class="grid two"><div class="card"><h3>Active Patterns</h3><div id="active"></div></div><div class="card"><h3>Unused Watchlist</h3><div id="unused"></div></div></div></section>
  <section id="research" class="pane"><div class="grid"><div class="card"><h3>Index Zones</h3><div id="zones"></div></div><div class="card"><h3>Weekday</h3><div id="weekday"></div></div><div class="card"><h3>Move Research</h3><div id="moves"></div></div></div></section>
</main>
<script>
const S={data:null,ohlcv:[]},fmt=new Intl.NumberFormat("en-US"),pct=x=>x==null||Number.isNaN(+x)?"-":`${(+x*100).toFixed(1)}%`,money=x=>x==null?"-":`$${fmt.format(Math.round(+x))}`,parse=d=>new Date(`${d}T00:00:00Z`);
function closedCutoff(){let n=new Date();if(n.getUTCHours()<3)n=new Date(n.getTime()-86400000);return n.toISOString().slice(0,10)}
function closedRows(){let c=closedCutoff();return S.ohlcv.filter(r=>r.timestamp<c)}
function expand(p){return p.compact?{meta:p.m||{},indices:(p.i||[]).map(r=>({date:r[0],index_BTC:r[1],index_me:r[2]})),scenario_forecasts:(p.s||[]).map(r=>({date:r[0],forecast:r[1],confidence:r[2],matches:r[3],mean_similarity:r[4],trap_warning:r[5],similar_dates:r[6],actual:r[7],status:r[8],actual_return_3d:r[9],actual_range_2d:r[10]})),active_patterns:(p.ap||[]).map(r=>({direction:r[0],rank:r[1],pattern:r[2],occurrences:r[3],hit_rate:r[4]})),unused_patterns:(p.up||[]).map(r=>({direction:r[0],rank:r[1],pattern:r[2],occurrences:r[3],hit_rate:r[4]})),tables:p.t||{},move_research:p.mr||[]}:p}
function outcome(ret,range){return ret>.036?"up":ret<-.036?"down":range<=.02?"sideway":"mixed"}function grade(s){let rows=closedRows(),i=rows.findIndex(r=>r.timestamp===s.date);if(i<0||i+3>=rows.length)return{status:"pending",actual:null};let f=rows.slice(i+1,i+4),b=+rows[i].close,ret=+f[2].close/b-1,range=Math.max(+f[0].high,+f[1].high)/Math.min(+f[0].low,+f[1].low)-1,a=outcome(ret,range);return{status:a===s.forecast?"correct":a==="mixed"?"partial":"wrong",actual:a,ret}}
function table(rows,cols){if(!rows||!rows.length)return"<p class=muted>No rows.</p>";return`<div style="overflow:auto"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]?c[2](r[c[0]]):r[c[0]]??"-"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function fill(sel,vals,pick){sel.innerHTML="";vals.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;if(String(v)===String(pick))o.selected=true;sel.appendChild(o)})}
function renderMetrics(){let m=S.data.meta,l=S.ohlcv.at(-1),c=closedRows().at(-1),matched=S.ohlcv.filter(r=>r.index_BTC!=null).length;metrics.innerHTML=[["Index records",m.index_records,`${m.index_start} to ${m.index_end}`],["Closed daily",c?.timestamp,`close ${money(c?.close)}`],["Live daily",l?.timestamp,`last ${money(l?.close)}`],["Active patterns",S.data.active_patterns.length,`${S.data.unused_patterns.length} watchlist`]].map(x=>`<div class="card metric"><span class=muted>${x[0]}</span><br><b>${x[1]}</b><br><span class=muted>${x[2]}</span></div>`).join("");status.textContent=`Generated ${m.generated_at} | Closed ${c?.timestamp||m.latest_market_date} | Live ${l?.timestamp||"-"} | ${matched} matched candles`}
function initSelectors(){let ys=[...new Set(S.ohlcv.map(r=>r.timestamp.slice(0,4)))].sort().reverse();fill(hy,ys,ys[0]);histMonths();let latest=closedRows().at(-1)?.timestamp||"";let fyv=[...new Set(S.data.indices.filter(r=>r.date>latest).map(r=>r.date.slice(0,4)))].sort();fill(fy,fyv,fyv[0]);futureMonths()}
function histMonths(){let y=hy.value,ms=[...new Set(S.ohlcv.filter(r=>r.timestamp.startsWith(y)).map(r=>+r.timestamp.slice(5,7)))].sort((a,b)=>a-b);fill(hm,ms,ms.at(-1))}
function futureMonths(){let y=fy.value,latest=closedRows().at(-1)?.timestamp||"",ms=[...new Set(S.data.indices.filter(r=>r.date>latest&&r.date.startsWith(y)).map(r=>+r.date.slice(5,7)))].sort((a,b)=>a-b);fill(fm,ms,ms[0])}
function drawPrice(){let y=hy.value,m=String(hm.value).padStart(2,"0"),start=parse(`${y}-${m}-01`),end=new Date(start);end.setUTCMonth(end.getUTCMonth()+1);let rows=S.ohlcv.filter(r=>parse(r.timestamp)>=start&&parse(r.timestamp)<end);Plotly.newPlot("price",[{type:"candlestick",name:"BTC",x:rows.map(r=>r.timestamp),open:rows.map(r=>r.open),high:rows.map(r=>r.high),low:rows.map(r=>r.low),close:rows.map(r=>r.close),yaxis:"y"},{type:"scatter",mode:"lines+markers",name:"index_BTC",x:rows.map(r=>r.timestamp),y:rows.map(r=>r.index_BTC),yaxis:"y2",line:{color:"#f7931a",width:3}},{type:"scatter",mode:"lines+markers",name:"index_me",x:rows.map(r=>r.timestamp),y:rows.map(r=>r.index_me),yaxis:"y2",line:{color:"#60a5fa",width:3}}],layout({yaxis:{domain:[.42,1],title:"BTC"},yaxis2:{domain:[0,.32],range:[0,100],title:"Index"}}))}
function drawFuture(){let y=fy.value,m=String(fm.value).padStart(2,"0"),p=`${y}-${m}`,dir=fd.value,thr=+ft.value,idx=S.data.indices.filter(r=>r.date.startsWith(p)),sc=S.data.scenario_forecasts.filter(r=>r.date.startsWith(p)&&r.confidence>=thr&&r.matches>=5&&(dir==="All"||r.forecast===dir)).sort((a,b)=>a.date.localeCompare(b.date));Plotly.newPlot("fchart",[{type:"scatter",mode:"lines+markers",name:"index_BTC",x:idx.map(r=>r.date),y:idx.map(r=>r.index_BTC),line:{color:"#f7931a",width:3}},{type:"scatter",mode:"lines+markers",name:"index_me",x:idx.map(r=>r.date),y:idx.map(r=>r.index_me),line:{color:"#60a5fa",width:3}},{type:"scatter",mode:"markers",name:"forecast",x:sc.map(r=>r.date),y:sc.map(r=>S.data.indices.find(i=>i.date===r.date)?.index_BTC),marker:{size:13,symbol:"diamond",color:sc.map(r=>r.forecast==="up"?"#22c55e":r.forecast==="down"?"#ef4444":"#fff")}}],layout({yaxis:{range:[0,100],title:"Index"}}));notes.innerHTML=sc.length?sc.map(s=>{let g=grade(s),st=g.status||s.status||"pending";return`<div class=scenario style="border-left-color:${st==="correct"?"#22c55e":st==="wrong"?"#ef4444":"#fff"}"><b>${s.date}</b> <span class="tag ${s.forecast}">${s.forecast}</span> <span class="tag ${st}">${st}</span><p class=muted>Confidence ${pct(s.confidence)} from ${s.matches} analogs. Actual: ${g.actual||s.actual||"pending"}${s.trap_warning?" . Trap warning active.":""}</p><p class=muted>Similar dates: ${s.similar_dates||"-"}</p></div>`}).join(""):`<p class=muted>No forecast matches ${p}.</p>`}
function layout(extra){return Object.assign({paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{color:"#f8fafc"},hovermode:"x unified",legend:{orientation:"h"},xaxis:{gridcolor:"rgba(255,255,255,.08)",showspikes:true,spikecolor:"rgba(255,255,255,.66)",spikemode:"across"},margin:{l:55,r:20,t:20,b:40}},extra)}
function renderLists(){active.innerHTML=S.data.active_patterns.map(p=>`<p><span class="tag ${p.direction}">${p.direction}</span> rank #${p.rank}<br><b>${p.pattern}</b><br><span class=muted>${p.occurrences} occurrences | ${pct(p.hit_rate)}</span></p>`).join("");unused.innerHTML=S.data.unused_patterns.slice(0,16).map(p=>`<p><span class="tag ${p.direction}">${p.direction}</span> rank #${p.rank}<br><b>${p.pattern}</b><br><span class=muted>${p.occurrences} occurrences | ${pct(p.hit_rate)}</span></p>`).join("")}
function renderTables(){zones.innerHTML=table(S.data.tables.index_zones,[["zone","Zone"],["observations","Obs"],["pivot_high_next_N","Pivot high",pct],["pivot_low_next_N","Pivot low",pct],["mean_return_3d","3D",pct]]);weekday.innerHTML=table(S.data.tables.weekday,[["weekday","Day"],["observations","Obs"],["mean_return_3d","3D",pct],["mean_return_7d","7D",pct]]);moves.innerHTML=table(S.data.move_research,[["BTC move label","Label"],["observations","Obs"],["same_phase_rate","Same",pct],["opposite_phase_rate","Opposite",pct],["shock_rate","Shock",pct]])}
async function load(){S.data=expand(await (await fetch("/data/dashboard.json",{cache:"no-cache"})).json());let live=await fetch(`/api/ohlcv?timeframe=1d&start=2026-01-01`),rows=live.ok?(await live.json()).rows:[];let by=new Map(S.data.indices.map(r=>[r.date,r]));S.ohlcv=rows.map(r=>Object.assign(r,by.get(r.timestamp)||{}));renderMetrics();initSelectors();drawPrice();drawFuture();renderLists();renderTables()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.pane").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.p).classList.add("on");setTimeout(()=>{drawPrice();drawFuture()},50)});[hy,hm].forEach(x=>x.onchange=()=>{if(x===hy)histMonths();drawPrice()});[fy,fm,fd,ft].forEach(x=>x.onchange=()=>{if(x===fy)futureMonths();drawFuture()});load().catch(e=>{document.body.innerHTML=`<main class=wrap><div class=card>Dashboard failed: ${e.message}</div></main>`;console.error(e)});
</script>
</body>
</html>
